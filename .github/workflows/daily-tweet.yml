name: daily-tweet

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily (US morning, EU afternoon, Asia evening)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tweepy
      - run: python post.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save progress
        run: |
          git config user.name "tweet-bot"
          git config user.email "tweet-bot@users.noreply.github.com"
          git add content/state.json
          git diff --cached --quiet || git commit -m "posted daily tweet"
          git push
